[package]
name = "edge-codec"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Dual-path tree-sitter Python & Rust lexical scope/definition hint extractor for Micro-TERRA"

[lib]
name = "edge_codec"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "edge-codec-cli"
path = "src/bin/edge_codec_cli.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "=0.24.7"
tree-sitter-language = "<=0.1.7"
tree-sitter-python = "=0.23.6"
tree-sitter-rust = "=0.23.2"
